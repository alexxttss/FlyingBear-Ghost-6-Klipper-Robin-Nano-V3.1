[gcode_macro SAVE_UPDATES]
description: Run SAVE_CONFIG if there are updates that it may persist to disk
gcode:
    {% if printer.configfile.save_config_pending %}
        M118 Saving and restarting now
        G4 P2000                                                                # wait 2 seconds
        SAVE_CONFIG
    {% endif %}

